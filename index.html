<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>匿名投票</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>你最喜欢以下哪些角色？</h1>

    <p class="description">
        可多选。提交后才能查看投票结果。
    </p>

    <form id="pollForm">

        <label class="option">
            <input type="checkbox" value="沈清秋">
            <span>沈清秋</span>
        </label>

        <label class="option">
            <input type="checkbox" value="柳清歌">
            <span>柳清歌</span>
        </label>

        <label class="option">
            <input type="checkbox" value="洛冰河">
            <span>洛冰河</span>
        </label>

        <label class="option">
            <input type="checkbox" value="其他">
            <span>其他</span>
        </label>

        <button type="submit" id="submitButton">
            提交投票
        </button>

    </form>


    <div id="message"></div>


    <div id="results" class="hidden">

        <h2>投票结果</h2>

        <div id="resultList"></div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
