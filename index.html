<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>匿名投票</title>

<style>

:root {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:#222;

  background:#f6f6f6;
}


* {
  box-sizing:border-box;
}


body {

  margin:0;

  padding:28px 16px;
}


.card {

  max-width:680px;

  margin:0 auto;

  background:white;

  border-radius:18px;

  padding:24px;

  box-shadow:
    0 6px 30px #00000010;
}


h1 {

  font-size:25px;

  margin:
    0 0 8px;
}


h2 {

  font-size:19px;
}


.muted {

  color:#777;

  font-size:14px;
}


label {

  display:block;

  font-weight:600;

  margin:
    15px 0 7px;
}


input[type=text],
input[type=password],
input[type=url],
input[type=number] {

  width:100%;

  padding:12px;

  border:
    1px solid #ccc;

  border-radius:10px;

  font-size:15px;
}


.option-input {

  display:flex;

  gap:8px;

  margin:8px 0;
}


.option-input input {

  flex:1;
}


.option {

  display:flex;

  gap:10px;

  align-items:center;

  border:
    1px solid #ddd;

  border-radius:12px;

  padding:12px;

  margin:10px 0;

  cursor:pointer;

  font-weight:normal;
}


.option input {

  width:18px;

  height:18px;
}


.btn {

  border:0;

  border-radius:12px;

  padding:11px 16px;

  cursor:pointer;

  font-size:15px;

  background:#222;

  color:white;
}


.btn.secondary {

  background:#eee;

  color:#222;
}


.row {

  display:flex;

  gap:10px;

  flex-wrap:wrap;
}


.notice {

  padding:11px 13px;

  border-radius:10px;

  background:#f1f1f1;

  margin:12px 0;

  font-size:14px;
}


.divider {

  height:1px;

  background:#eee;

  margin:22px 0;
}


.progress {

  height:12px;

  background:#eee;

  border-radius:99px;

  overflow:hidden;
}


.bar {

  height:100%;

  background:#222;
}


.result {

  margin:15px 0;
}


.result-head {

  display:flex;

  justify-content:space-between;

  gap:12px;

  margin-bottom:6px;
}


.small {

  font-size:12px;

  color:#888;

  line-height:1.5;
}


.option-count {

  margin-top:10px;

  font-size:14px;

  color:#777;
}

</style>

</head>


<body>

<div class="card">

<div id="app"></div>

</div>


<script>

// 固定 Apps Script 后端地址，不再依赖 localStorage
const FIXED_API_URL = "https://script.google.com/macros/s/AKfycbyr48uqkkW6qVEY7xoB75aI8uoroWFJejuRTr2Id3gOSLpQUggzL9HW6_Q6NAjRTWPHOA/exec";

const qs =
  new URLSearchParams(
    location.search
  );


const pollId =
  qs.get("poll");


const state = {

  api: FIXED_API_URL,

  adminKey:
    sessionStorage.getItem(
      "vote_admin_key"
    ) || ""

};


function esc(s) {

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function apiCall(body) {

  return fetch(
    state.api,
    {

      method:"POST",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(body)

    }

  )

  .then(async r => {

    const text =
      await r.text();

    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      throw new Error(
        text ||
        "服务器返回异常"
      );

    }


    if (data.ok === false || data.success === false) {

      throw new Error(
        data.error ||
        "操作失败"
      );

    }


    return data;

  });

}


function getData() {

  return fetch(

    state.api +
    "?action=getPoll&pollId=" +
    encodeURIComponent(
      pollId
    )

  )

  .then(r => r.json())

  .then(d => {

    if (d.ok === false || d.success === false) {

      throw new Error(
        d.error ||
        "读取失败"
      );

    }

    return d;

  });

}


// ================================
// 创建投票页面
// ================================

function renderSetup() {

  document.getElementById(
    "app"
  ).innerHTML = `

    <h1>投票创建器</h1>

    <div class="muted">
      创建后会生成一个可直接分享的投票链接。
    </div>


    <label>
      Apps Script Web App URL
    </label>

    <input
      id="api"
      type="url"
      readonly
      value="${esc(state.api)}"
    >


    <label>
      管理员密钥
    </label>

    <input
      id="key"
      type="password"
      placeholder="你在 Code.gs 中设置的密码"
    >


    <label>
      投票标题
    </label>

    <input
      id="title"
      type="text"
      placeholder="例如：你最喜欢哪个角色？"
    >


    <label>
      投票类型
    </label>

    <select
      id="type"
      style="
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:15px;
      "
      onchange="updateChoiceSettings()"
    >

      <option value="single">
        单选
      </option>

      <option value="multiple">
        多选
      </option>

    </select>


    <div
      id="choiceSettings"
      style="display:none"
    >

      <label>
        最少选择数量
      </label>

      <input
        id="minChoices"
        type="number"
        min="1"
        value="1"
      >

      <label>
        最多选择数量
      </label>

      <input
        id="maxChoices"
        type="number"
        min="0"
        value="0"
      >

      <div class="small">
        最多选择数量填 0 表示不限。
      </div>

    </div>


    <label>
      选项
    </label>

    <div id="opts"></div>


    <div class="row">

      <button
        class="btn secondary"
        onclick="addOpt()"
      >
        ＋添加选项
      </button>

      <button
        class="btn"
        onclick="createPoll()"
      >
        创建投票
      </button>

    </div>

  `;


  addOpt();

  addOpt();

}


// ================================
// 单选/多选设置
// ================================

function updateChoiceSettings() {

  const type =
    document.getElementById(
      "type"
    ).value;


  document.getElementById(
    "choiceSettings"
  ).style.display =
    type === "multiple"
      ? "block"
      : "none";

}


// ================================
// 添加选项
// ================================

function addOpt(v="") {

  const box =
    document.getElementById(
      "opts"
    );


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "option-input";


  row.innerHTML = `

    <input
      type="text"
      placeholder="选项 ${box.children.length + 1}"
      value="${esc(v)}"
    >

    <button
      class="btn secondary"
      onclick="this.parentElement.remove()"
    >
      删除
    </button>

  `;


  box.appendChild(row);

}


// ================================
// 创建投票
// ================================

async function createPoll() {

  const key =
    document.getElementById(
      "key"
    ).value;


  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const options =
    [
      ...document.querySelectorAll(
        "#opts input"
      )
    ]

    .map(x => x.value.trim())

    .filter(Boolean);


  let minChoices = 1;

  let maxChoices = 1;


  if (
    type === "multiple"
  ) {

    minChoices =
      Number(
        document.getElementById(
          "minChoices"
        ).value
      ) || 1;


    maxChoices =
      Number(
        document.getElementById(
          "maxChoices"
        ).value
      ) || 0;

  }


  if (
    !key ||
    !title ||
    options.length < 2
  ) {

    return alert(
      "请填写完整信息，并至少设置两个选项。"
    );

  }


  state.adminKey = key;

  sessionStorage.setItem(
    "vote_admin_key",
    key
  );


  try {

    const d =
      await apiCall({

        action:
          "createPoll",

        adminKey:
          key,

        title:
          title,

        options:
          options,

        type:
          type,

        minChoices:
          minChoices,

        maxChoices:
          maxChoices

      });


    const pollIdVal = d.pollId || (d.poll && d.poll.id);

    const url =
      location.origin +
      location.pathname +
      "?poll=" +
      encodeURIComponent(
        pollIdVal
      );


    document.getElementById(
      "app"
    ).innerHTML = `

      <h1>
        投票已创建
      </h1>


      <div class="notice">

        投票 ID：
        ${esc(pollIdVal)}

      </div>


      <label>
        分享链接
      </label>


      <input
        id="shareUrl"
        type="text"
        readonly
        value="${esc(url)}"
      >


      <div
        class="row"
        style="margin-top:10px"
      >

        <button
          class="btn"
          onclick="
            navigator.clipboard.writeText(
              document.getElementById(
                'shareUrl'
              ).value
            );
            alert('已复制');
          "
        >
          复制链接
        </button>


        <button
          class="btn secondary"
          onclick="
            location.href =
              '?poll=${encodeURIComponent(
                pollIdVal
              )}'
          "
        >
          打开投票
        </button>

      </div>

    `;

  }

  catch(e) {

    alert(
      e.message
    );

  }

}


// ================================
// 投票页面
// ================================

async function renderPoll() {

  try {

    const d =
      await getData();


    const p =
      d.poll || d;


    const pollType = p.type || "single";
    const pollTotal = p.total || 0;
    const pollMin = p.minChoices || 1;
    const pollMax = p.maxChoices || 0;
    const pollTitle = p.title || "在线投票";
    const pollOpts = p.options || [];


    document.getElementById(
      "app"
    ).innerHTML = `

      <h1>
        ${esc(pollTitle)}
      </h1>


      <div class="muted">

        ${
          pollType === "multiple"
            ? "多选投票"
            : "单选投票"
        }

        · 共 ${pollTotal} 票

      </div>


      <div id="voteBox"></div>

      <div id="results"></div>


      <div class="divider"></div>


      <div class="small">

        ${
          pollType === "multiple"
            ? `可选择 ${pollMin} 个以上${
                pollMax > 0
                  ? `，最多 ${pollMax} 个`
                  : ""
              }。`
            : "请选择一个选项。"
        }

      </div>

    `;


    const alreadyVoted =
      localStorage.getItem(
        "voted_" + pollId
      );


    if (
      alreadyVoted
    ) {

      if (d.results) {
        showResults(pollTotal, d.results);
      }
      return;

    }


    let inputType =
      pollType === "multiple"
        ? "checkbox"
        : "radio";


    document.getElementById(
      "voteBox"
    ).innerHTML = `

      ${pollOpts.map(
        (o,i) => `

          <label class="option">

            <input
              type="${inputType}"
              name="vote"
              value="${i}"
            >

            <span>
              ${esc(o)}
            </span>

          </label>

        `
      ).join("")}


      <button
        class="btn"
        style="margin-top:12px;"
        onclick="submitVote('${pollType}', ${pollMin}, ${pollMax})"
      >
        提交投票
      </button>

    `;


    if (d.results) {
      showResults(pollTotal, d.results);
    }

  }

  catch(e) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <h1>
        打不开投票
      </h1>

      <div class="notice">
        ${esc(e.message)}
      </div>

    `;

  }

}


// ================================
// 提交投票
// ================================

async function submitVote(type, minChoices, maxChoices) {

  const selected =
    [
      ...document.querySelectorAll(
        'input[name="vote"]:checked'
      )
    ]

    .map(
      x => Number(x.value)
    );


  if (
    selected.length === 0
  ) {

    return alert(
      "请选择至少一个选项。"
    );

  }

  if (type === "multiple") {
    if (minChoices > 0 && selected.length < minChoices) {
      return alert(`请至少选择 ${minChoices} 个选项。`);
    }
    if (maxChoices > 0 && selected.length > maxChoices) {
      return alert(`最多只能选择 ${maxChoices} 个选项。`);
    }
  }


  try {

    await apiCall({

      action:
        "vote",

      pollId:
        pollId,

      selectedOptions:
        selected,

      selected:
        selected

    });


    localStorage.setItem(
      "voted_" + pollId,
      "1"
    );


    alert("投票成功！");
    renderPoll();

  }

  catch(e) {

    alert(
      e.message
    );

  }

}


// ================================
// 显示结果
// ================================

function showResults(
  total,
  results
) {

  document.getElementById(
    "results"
  ).innerHTML = `

    <div class="divider"></div>

    <h2>
      当前结果
    </h2>


    ${results.map(
      r => {

        const count = r.count !== undefined ? r.count : (r.votes || 0);
        const optText = r.option !== undefined ? r.option : (r.text || "");

        const pct =
          total
            ? count /
              total *
              100
            : 0;


        return `

          <div class="result">

            <div class="result-head">

              <span>
                ${esc(optText)}
              </span>

              <b>
                ${pct.toFixed(1)}\%                 (${count}票)
              </b>

            </div>


            <div class="progress">

              <div
                class="bar"
                style="
                  width:${pct}%
                "
              ></div>

            </div>

          </div>

        `;

      }
    ).join("")}


    <div class="muted">

      总投票人数：
      ${total}

    </div>

  `;

}


// ================================
// 启动
// ================================

if (pollId) {

  renderPoll();

} else {

  renderSetup();

}

</script>

</body>

</html>
