<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投票</title>
<body style="font-family:sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem">
<h2>你的标题（可多选）</h2>
<div id="app">加载中…</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyveqrivsoOY1SGqZbY4YaG2Vvi4INh5zS_KNx5Q6v647c-R2p5x7XHB5dClPtsQcWJ/exec";
const app = document.getElementById("app");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showResults(results) {
  app.innerHTML = OPTIONS.map(o => {
    const r = results.find(x => x.option === o) || { votes: 0, percentage: 0 };
    return '<div style="margin:8px 0">' + esc(o) + "：" + r.percentage + "%（" + r.votes + "票）" +
      '<div style="background:#eee"><div style="background:#4a8;height:10px;width:' + r.percentage + '%"></div></div></div>';
  }).join("");
}

function showForm(options) {
  app.innerHTML = options.map((o, i) =>
    '<label style="display:block;margin:8px 0"><input type="checkbox" value="' + i + '"> ' + esc(o) + "</label>"
  ).join("") + '<button id="go">提交</button> <span id="msg" style="color:#c33"></span>';

  document.getElementById("go").onclick = async () => {
    const selected = [...document.querySelectorAll("input:checked")].map(e => options[+e.value]);
    const msg = document.getElementById("msg");
    if (!selected.length) { msg.textContent = "至少选一项"; return; }
    msg.textContent = "提交中…";
    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },  // 关键：避免预检请求
        body: JSON.stringify({ selected })
      });
      const data = await r.json();
      if (data.success) showResults(data.results);
      else msg.textContent = data.message;
    } catch (err) {
      msg.textContent = "提交失败：" + err;
    }
  };
}

const OPTIONS = ["选项一", "选项二", "选项三"];   // 以后改选项只改这里
showForm(OPTIONS);
